spring.application.name=backend-Kangalibry
server.port=8080
# Escucha en todas las interfaces: el emulador (10.0.2.2) y un celular en la misma red pueden llegar
server.address=0.0.0.0

# H2 en archivo (./data/kangalibry.mv.db): local, sin servidor externo, y los datos sobreviven al reiniciar
spring.datasource.url=jdbc:h2:file:./data/kangalibry
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# update: crea la tabla la primera vez y agrega columnas nuevas si cambia la entidad
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# consola web en http://localhost:8080/h2-console (solo accesible desde el propio PC)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
